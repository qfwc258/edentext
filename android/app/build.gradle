plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// versionCode 由 git 提交数推导（单调递增）；versionName 跟随 EdenText 自身版本。
def gitCommitCount = {
    def out = new ByteArrayOutputStream()
    exec {
        commandLine('git', 'rev-list', '--count', 'HEAD')
        standardOutput = out
    }
    return out.toString().trim().toInteger()
}.call()

android {
    namespace 'com.wb.edentext'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wb.edentext'
        minSdk 24
        targetSdk 34
        versionCode gitCommitCount
        versionName "0.6.0"
    }

    signingConfigs {
        release {
            storeFile file('edentext-release.jks')
            storePassword 'edentext'
            keyAlias 'edentext'
            keyPassword 'edentext'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
