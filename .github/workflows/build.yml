name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      XCCAPK_TOKEN: ${{ secrets.XCCAPK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Slim & stage dist into Android assets
        run: |
          set -e
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/edentext
          # 只保留英文词典/同义词库，删除其它语言以缩小 APK
          rm -rf dist/dictionaries/es dist/dictionaries/de dist/dictionaries/fr dist/dictionaries/pt dist/dictionaries/ru
          rm -rf dist/thesaurus/fr dist/thesaurus/pt dist/thesaurus/es dist/thesaurus/de dist/thesaurus/ru
          # 删除 Web 专用、离线 App 用不上的文件
          rm -f dist/sw.js dist/count.js dist/og-image.png dist/sitemap.xml dist/robots.txt dist/googlee*.html dist/favicon-old.svg dist/apple-touch-icon* dist/EdenText.png
          cp -r dist/. android/app/src/main/assets/edentext/
          echo "assets 大小："
          du -sh android/app/src/main/assets/edentext

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        id: ver
        run: |
          set -e
          APK_PATH=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          VERSION_NAME=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' android/app/build/outputs/apk/release/output-metadata.json | head -1)
          APK_NEW_NAME="edentext-${VERSION_NAME}.apk"
          mkdir -p release-out
          cp "$APK_PATH" "release-out/${APK_NEW_NAME}"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "apk_path=release-out/${APK_NEW_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NEW_NAME}" >> $GITHUB_OUTPUT

      - name: Publish to source repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edentext-v${{ steps.ver.outputs.version_name }}
          name: EdenText v${{ steps.ver.outputs.version_name }}
          body: |
            ## EdenText 安卓版自动构建
            纯前端文字处理器打包为 WebView 离线 App：本地打开/编辑 .odt/.docx，文档不出设备。
          files: ${{ steps.ver.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to xccapk (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.XCCAPK }}
        run: |
          set +e
          APK="${{ steps.ver.outputs.apk_path }}"
          VER="${{ steps.ver.outputs.version_name }}"
          TAG="edentext-v${VER}"
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::未配置 secrets.XCCAPK，跳过 xccapk 发布（源码仓 Release 已保留 APK）。"
            exit 0
          fi
          printf '## EdenText 安卓版\n\n纯前端文字处理器，本地打开/编辑 .odt/.docx。' > /tmp/notes.md
          if gh release view "$TAG" --repo qfwc258/xccapk >/dev/null 2>&1; then
            gh release upload "$TAG" --repo qfwc258/xccapk "$APK" --clobber
          else
            gh release create "$TAG" --repo qfwc258/xccapk --title "EdenText v${VER}" --notes-file /tmp/notes.md --latest "$APK"
          fi
          if [ $? -eq 0 ]; then echo "✓ xccapk 发布成功：${TAG}"; fi
